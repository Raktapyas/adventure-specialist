; Local development PHP upload limits.
;
; The system php.ini on this machine caps upload_max_filesize at 2M, which is
; BELOW the application's 5 MB upload contract (config/media.php). PHP rejects
; any 2-5 MB file with UPLOAD_ERR_INI_SIZE *before* Laravel validation runs, so
; users see the generic "The media.0 failed to upload." error.
;
; This override raises the dev-server limits to match the app contract. It is
; applied to the PHP built-in server via PHP_INI_SCAN_DIR, e.g.:
;
;   PHP_INI_SCAN_DIR="/etc/php/conf.d:$(pwd)/.php-ini" php artisan serve
;
; Production requirements are documented in docs/production-requirements.md.
; Do not lower these below the app's limits (5 MB / 6 MB) — raise the server
; limits instead.

upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 20
